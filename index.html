<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get, push, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAOKxix32T2rC9_TrF9mk6socuR0YCcVno",
  authDomain: "mrphuc-51580.firebaseapp.com",
  databaseURL: "https://mrphuc-51580-default-rtdb.firebaseio.com",
  projectId: "mrphuc-51580",
  storageBucket: "mrphuc-51580.firebasestorage.app",
  messagingSenderId: "922607657180",
  appId: "1:922607657180:web:2d1f482bd5aa562214d419"
});
const db = getDatabase(app);
const DB = "phuc_vip_final";
let user = null;

// Điều hướng
window.toggleMenu = () => {
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('overlay').classList.toggle('active');
};
window.showPage = (p) => {
  ['home', 'deposit', 'addlink', 'admin'].forEach(x => document.getElementById('page-'+x).classList.add('hidden'));
  document.getElementById('page-'+p).classList.remove('hidden');
  toggleMenu();
};
window.openModal = (id) => document.getElementById(id).classList.add('active');
window.closeModal = (id) => document.getElementById(id).classList.remove('active');

// Đăng nhập
window.doLogin = async () => {
  const u = document.getElementById('logUser').value.trim().toLowerCase();
  const p = document.getElementById('logPass').value;
  if(u === 'phuc' && p === 'phc51580') {
    user = { user: 'Phuc', role: 'admin', balance: 999999 };
    updateUI(); closeModal('loginModal'); return;
  }
  const snap = await get(ref(db, DB+'/users/'+u));
  if(snap.exists() && snap.val().pass === p) {
    user = snap.val();
    updateUI(); closeModal('loginModal');
  } else alert('Sai tài khoản hoặc mật khẩu!');
};

window.logout = () => { user = null; updateUI(); showPage('home'); };

function updateUI() {
  const el = document.getElementById('userInfo');
  if(user) {
    el.innerHTML = `<b style="color:#ffa502">${user.balance.toLocaleString()}đ</b> | ${user.user}`;
    document.getElementById('navLogout').classList.remove('hidden');
    if(user.role === 'admin' || user.role === 'staff') document.getElementById('navStaff').classList.remove('hidden');
    if(user.role === 'admin') document.getElementById('navAdmin').classList.remove('hidden');
  } else {
    el.innerHTML = 'Đăng nhập';
    document.getElementById('navLogout').classList.add('hidden');
    document.getElementById('navStaff').classList.add('hidden');
    document.getElementById('navAdmin').classList.add('hidden');
  }
}

// Đăng link
window.submitLink = async () => {
  if(!user) return;
  const title = document.getElementById('addTitle').value;
  const img = document.getElementById('addImg').value;
  const goc = document.getElementById('addGoc').value;
  const vuot = document.getElementById('addVuot').value;
  const price = parseInt(document.getElementById('addPrice').value) || 0;
  if(!title || !goc) return alert('Nhập tên và link gốc!');
  
  await push(ref(db, DB+'/links'), { staff: user.user, title, img, goc, vuot: vuot||goc, price });
  alert('Đăng thành công!'); showPage('home');
};

// Render Links
onValue(ref(db, DB+'/links'), (snap) => {
  const grid = document.getElementById('linkGrid');
  if(!snap.exists()) { grid.innerHTML = '<p>Chưa có link nào.</p>'; return; }
  let html = '';
  Object.entries(snap.val()).forEach(([id, l]) => {
    let btn = l.price > 0 
      ? `<button class="btn-vuot" onclick="window.open('${l.vuot}','_blank')">Vượt Link</button>
         <button class="btn-mua" onclick="buy('${id}','${l.staff}',${l.price},'${l.goc}')">Mua: ${l.price.toLocaleString()}đ</button>`
      : `<button class="btn-mua" onclick="window.open('${l.goc}','_blank')">Vào Link</button>`;
    html += `<div class="card">
      ${l.img ? `<img src="${l.img}">` : `<div class="icon">🔗</div>`}
      <h3>${l.title}</h3>
      ${btn}
    </div>`;
  });
  grid.innerHTML = html;
});

window.buy = async (id, staffName, price, url) => {
  if(!user) return alert('Vui lòng đăng nhập!');
  if(user.balance < price) return alert('Không đủ tiền!');
  if(!confirm(`Mua link này với giá ${price.toLocaleString()}đ?`)) return;
  
  // Trừ tiền người mua
  user.balance -= price;
  await update(ref(db, DB+'/users/'+user.user), { balance: user.balance });
  updateUI();
  
  // Cộng tiền staff
  const sSnap = await get(ref(db, DB+'/users/'+staffName));
  if(sSnap.exists()) await update(ref(db, DB+'/users/'+staffName), { balance: (sSnap.val().balance||0) + price });
  
  window.open(url, '_blank');
};

// Nạp tiền
window.createDeposit = async () => {
  if(!user) return alert('Đăng nhập trước!');
  const amt = parseInt(document.getElementById('depAmount').value);
  if(!amt) return;
  const code = 'nap-' + Math.floor(Math.random()*9999);
  await push(ref(db, DB+'/deposits'), { user: user.user, amt, code, status: 'pending' });
  document.getElementById('depCode').innerText = code;
  document.getElementById('depResult').classList.remove('hidden');
};

// Admin Panel
window.loadAdminTab = async (tab) => {
  const el = document.getElementById('adminContent');
  if(tab === 'duyet') {
    const snap = await get(ref(db, DB+'/deposits'));
    let html = '<h3>Đơn Nạp Tiền</h3>';
    if(snap.exists()) {
      Object.entries ((snap.val()).filter(([k,v])=>v.status==='pending').forEach(([id, d]) => {
        html += `<div style="Lbackground:#333;padding:10px;margin-bottom:10px;border-radius:5px">
          <p>${d.user} nạp ${d.amtần.toLocaleString()}đ</p>
          <button class="btn" style="background:#2ed573" onclick="duyet này('${id}','${d.user}',${d.amt})">Duyệt</button>
        </div code>`;
      });
    }
    el.innerHTML = html;
  } else {
    el.innerHTML = `<h3>Tạo Nhân Viên</h3>
      r <input type="text" id="sUser" placeholder="Tên NV">
      <input type="password" id="sPass" placeholder="Mật khẩu">
      <button class="btn" onclick="createStaff()">Tạo</button>`;
  }
};

window.duyet = async (id,ất username, amt) => {
  const snap = await get(ref(db, DB+'/users/'+username));
  const u = snap.val();
  const new ngTotal = (u.totalDeposit||0) + amt;
  let vip = 0; if(newTotal >= 60000) vip=3; else if(newTotal >= 40000) vip=2; else if(newTotal >= 20000) vip=1;
  
  await update(ref(db, DB+'/users/'+username), { balance: (u.balance||0)+amt, totalDeposit: newTotal, vip });
  await update(ref(db, DB+'/deposits/'+id), { status: 'done' });
  alert('Đã duyệt!'); loadAdminTab('duyet');
};

window.createStaff = async () => {
  const u = document.getElementById('sUser').value;
  const p = document.getElementById('sPass').value;
  if(!u || !p) return;
  await set(ref(db, DB+'/users/'+u), { user: u, pass: p, role: 'staff', balance: 0, totalDeposit: 0, vip: 0 });
  alert('Tạo thành công!');
};

// Tự động đăng nhập
const session = localStorage.getItem('phuc_session');
if(session) { user = JSON.parse(session); updateUI(); }
</script>
